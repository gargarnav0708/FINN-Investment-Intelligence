# Render's free plan puts the service to sleep after ~15 idle minutes, and waking takes about a
# minute, which is long enough for a phone browser to give up. This pings the health endpoint every
# 5 minutes so evaluators always hit a warm instance. Delete this file to let the service sleep.
name: Keep FINN awake
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.FINN_URL }}"
          URL="${URL:-https://finn-vno3.onrender.com}"
          for i in 1 2 3 4; do
            curl -fsS --max-time 100 "$URL/api/health" && exit 0
            sleep 15
          done
          exit 1
